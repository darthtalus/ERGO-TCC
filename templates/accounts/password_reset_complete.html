{% extends 'base_auth.html' %}
{% load static i18n %}
{% block css %}
  <link href="{% static 'css/login.css' %}" rel="stylesheet">
{% endblock css %}
{% block content %}
<div class="d-flex flex-column min-vh-100 justify-content-center align-items-center">

  <div class="d-flex mb-5 min-vw-100 justify-content-around">
    <div>
      <img src="{% static 'images/cover.png' %}" height="318" alt="">
    </div>
    <div>
      <img src="{% static 'images/logo_horizontal.png' %}" class="logo" height="84" alt="logo horizontal">
      <div class="login-card text-center">
          <h3 class="mb-4">{% trans "Password Changed!" %}</h3>
          <p class="mb-4">{% trans "Your password has been successfully reset. You can now log in with your new credential." %}</p>
          
          <div class="mt-4">
              <a href="{% url 'login' %}" class="btn btn-primary prima">{% trans "Login" %}</a>
          </div>
      </div>
    </div>
  </div>
</div>

{% endblock content %}
